[package]
name = "hull-ci-server"
description = "The M1 runner: one process wiring ingest → fetch broker → planner → an in-process node agent → callback."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Forwards to `hull-ci-secrets/infisical`. Declared here so `#[cfg(feature = "infisical")]` in this
# crate is a real condition: without it the cfg silently never matches and the KMS arm is dead code
# that looks wired — the "compiles, is tested, and is unreachable" failure this repo has hit before.
infisical = ["hull-ci-secrets/infisical"]

[dependencies]
hull-ci-proto = { path = "../hull-ci-proto" }
hull-ci-control = { path = "../hull-ci-control" }
hull-ci-fetch = { path = "../hull-ci-fetch" }
hull-ci-node = { path = "../hull-ci-node" }
hull-ci-plan = { path = "../hull-ci-plan" }
# §14.3's package proxy. The composition root is where the proxy acquires an allowlist, a credential
# source and a listener — and where the node is told which sandbox network to place jobs on. The two
# halves stay independently enforced: nothing here can make the node claim a posture it did not probe.
hull-ci-proxy = { path = "../hull-ci-proxy" }
# The composition root is where the secret broker acquires a deployment (D§7.4): a key manager, a
# store, and — before the node can redeem anything — an enrolment for the node's public key.
hull-ci-secrets = { path = "../hull-ci-secrets" }
# The operator panel's responses. The control plane hands out typed snapshots; the HTTP shape of
# `/admin/*` is this crate's to own, so the serialization lives here rather than on those types.
serde_json.workspace = true
thiserror.workspace = true
# `net` on top of the workspace feature set, for the listener this binary binds.
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
tracing-subscriber.workspace = true
axum.workspace = true
# Copy-on-write workspace materialization (D§6.2): `clonefile(2)` on APFS, the `FICLONE` ioctl on
# btrfs/XFS. A dependency rather than code here because both are `unsafe` FFI for a problem with one
# obvious right answer, and this crate has no other reason to hold `libc`. MIT OR Apache-2.0. Only
# the raw `reflink` call is used — the fallback to a byte copy is ours, in `workspace.rs`, so that no
# clone failure can be fatal and the reason for one is recorded rather than swallowed.
reflink-copy = "0.1.30"

[dev-dependencies]
tempfile.workspace = true
tar.workspace = true
reqwest.workspace = true
# Drives the admin router as a service, so "every admin route is read-only" is asserted against the
# router axum actually builds rather than against a list of `get(...)` calls read by eye.
tower = { version = "0.5", features = ["util"] }
# The end-to-end suite has to name a *real* `tree_id`, which means computing one the way keel does.
# Same git rev hull-ci-fetch pins, so both sides of the verification agree by construction rather
# than by two crates happening to be on compatible revisions.
keel-store = { git = "https://github.com/tankrap/keel", rev = "6827a3443de3c9be2e66887c8038310e32dddc37", package = "keel-store" }
