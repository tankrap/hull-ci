[workspace]
resolver = "2"
members = [
    "crates/hull-ci-proto",
    "crates/hull-ci-fetch",
    "crates/hull-ci-control",
    "crates/hull-ci-node",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/tankrap/hull-ci"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "fs", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tar = "0.4"
blake3 = "1"
hex = "0.4"
tempfile = "3"
